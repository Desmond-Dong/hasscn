name: Build Site

on:
  push:
    branches-ignore:
      - site-build
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build-deploy
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if hasscn.top version changed
        id: version-check
        run: |
          changed="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed="true"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed="true"
          elif git diff "${{ github.event.before }}" "${GITHUB_SHA}" -- package.json 2>/dev/null \
            | grep -qE '^[+-][[:space:]]*"version"'; then
            changed="true"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Clean tracked dependencies
        run: |
          rm -rf node_modules doc_build
          git clean -fdx node_modules || true

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload build output artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: doc-build
          path: doc_build

      - name: Publish build output to site-build branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc_build
          publish_branch: site-build
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'build: publish latest site output'
